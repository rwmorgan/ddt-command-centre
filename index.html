<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDT Command Centre — Rosny College</title>
<meta name="description" content="Self-contained command centre for relief, meetings, tasks and team coordination.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230E6E6E'/%3E%3Ctext x='12' y='16.5' font-family='Consolas,monospace' font-size='11' font-weight='700' fill='white' text-anchor='middle'%3EDDT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">DDT</div>
      <div class="brand-text">
        <span class="eyebrow">Rosny College</span>
        <h1>Command Centre</h1>
      </div>
    </div>
    <div class="topbar-clock">
      <span class="eyebrow">Local time</span>
      <span class="mono" id="clockNow">--:--</span>
    </div>
    <span class="eyebrow" id="saveIndicator" title="Data auto-saves to this computer">Saved</span>
    <button class="icon-btn" id="themeToggleBtn" title="Toggle theme" aria-label="Toggle light/dark theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn" id="backupBtnTop" title="Export backup" aria-label="Export backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg>
    </button>
  </header>

  <nav class="tabnav">
    <button data-tab="dashboard" class="active">Dashboard</button>
    <button data-tab="relief">Relief</button>
    <button data-tab="meetings">Meetings</button>
    <button data-tab="tasks">Tasks</button>
    <button data-tab="team">Team &amp; Files</button>
    <button data-tab="settings">Settings</button>
  </nav>

  <main>
    <div class="banner" id="backupBanner" style="display:none;">
      <span class="msg"></span>
      <button class="btn btn-sm" onclick="exportBackup()">Export now</button>
    </div>

    <section class="view active" id="view-dashboard"></section>
    <section class="view" id="view-relief"></section>
    <section class="view" id="view-meetings"></section>
    <section class="view" id="view-tasks"></section>
    <section class="view" id="view-team"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <footer class="app-foot">Runs entirely on this computer — no data leaves your machine. Export a backup regularly from Settings.</footer>
</div>

<div id="toast"></div>
<div class="print-only" id="printSheet"></div>

<div class="modal-backdrop" id="poolModalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="poolModalTitle">Add relief contact</h2>
      <button class="icon-btn" id="poolModalClose" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="field"><label for="pm-name">Name</label><input type="text" id="pm-name" placeholder="Full name"></div>
    <div class="row">
      <div class="field"><label for="pm-phone">Phone</label><input type="text" id="pm-phone" placeholder="04xx xxx xxx"></div>
      <div class="field"><label for="pm-email">Email</label><input type="text" id="pm-email" placeholder="name@example.com"></div>
    </div>
    <div class="field"><label for="pm-availability">Availability</label><textarea id="pm-availability" placeholder="e.g. Tuesday, Friday"></textarea></div>
    <div class="field"><label for="pm-subjects">Subjects / curriculum areas</label><textarea id="pm-subjects" placeholder="e.g. Maths;Science"></textarea></div>
    <div class="row" style="justify-content:flex-end;">
      <button class="btn" id="poolModalCancel">Cancel</button>
      <button class="btn btn-primary" id="poolModalSave">Save contact</button>
    </div>
  </div>
</div>

<!-- local-seed.js is gitignored and only exists on this computer — see its
     header comment. Missing on the published copy is expected and safe. -->
<script src="local-seed.js"></script>
<script src="app.js"></script>
</body>
</html>
